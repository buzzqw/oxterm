[package]
name = "oxterm"
version = "1.1.33"
edition = "2021"
default-run = "oxterm"
description = "Oxterm - a GTK4/VTE terminal emulator"
license = "EUPL-1.2"

[dependencies]
gtk = { path = "crates/gtk" }
glib = "0.22"
futures-channel = "0.3"
gio = "0.22"
gdk = { package = "gdk4", version = "0.11" }
gdk-pixbuf = "0.22"
pango = "0.22"
cairo-rs = "0.22"
zoha_vte = { path = "crates/zoha_vte", package = "zoha-vte" }
zoha_vte_sys = { package = "vte4-sys", version = "0.10", features = ["v0_84"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "hooks"] }
regex = "1"
libc = "0.2"
nix = { version = "0.29", features = ["process", "term", "fs", "signal", "ioctl", "poll"] }
dirs = "5"
once_cell = "1"
shell-words = "1"

[profile.release]
lto = true
strip = true
# Single codegen unit lets fat LTO optimize across the whole crate graph,
# producing a smaller and faster binary (at the cost of longer compile time).
codegen-units = 1
opt-level = 3
# Abort instead of unwinding: panics are fatal in a GUI anyway, and removing
# the landing pads shrinks the binary and shortens startup mapping.
panic = "abort"
