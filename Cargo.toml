[package]
name = "oxterm"
version = "1.1.0"
edition = "2021"
description = "Oxterm - a GTK3/VTE terminal emulator with AI integration"
license = "EUPL-1.2"

[dependencies]
gtk = "0.18"
glib = "0.18"
gio = "0.18"
gdk = "0.18"
gdk-pixbuf = "0.18"
pango = "0.18"
cairo-rs = "0.18"
zoha-vte = { version = "0.6", features = ["v0_72"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "hooks"] }
regex = "1"
libc = "0.2"
nix = { version = "0.29", features = ["process", "term", "fs", "signal", "ioctl", "poll"] }
dirs = "5"
once_cell = "1"
ureq = { version = "2", features = ["json"] }
shell-words = "1"

[profile.release]
lto = true
strip = true
# Single codegen unit lets fat LTO optimize across the whole crate graph,
# producing a smaller and faster binary (at the cost of longer compile time).
codegen-units = 1
opt-level = 3
