name: Build release artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Executable and checksums
    runs-on: ubuntu-24.04

    steps:
      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG="$PUSH_TAG"
          else
            TAG="$INPUT_TAG"
          fi
          if [[ ! "$TAG" =~ ^v?[0-9]+([.][0-9]+){0,2}$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          printf 'value=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out release
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.value }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install GTK/VTE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libvte-2.91-dev

      - name: Build release executable
        run: |
          cargo fmt --check
          cargo test --all-targets --locked
          cargo build --release --locked

      - name: Create executable archive and checksums
        run: |
          VERSION="${{ steps.tag.outputs.value }}"
          VERSION="${VERSION#v}"
          install -m 0755 target/release/TRust "TRust-${VERSION}-linux-x86_64"
          tar -czf "TRust-${VERSION}-linux-x86_64.tar.gz" "TRust-${VERSION}-linux-x86_64"
          sha256sum TRust-* > SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --generate-notes --title "TRust ${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            TRust-*.tar.gz TRust-*-linux-x86_64 SHA256SUMS \
            --clobber
