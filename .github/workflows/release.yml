name: Build release artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

env:
  APPIMAGETOOL_VERSION: 1.9.1
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0

jobs:
  release:
    name: AppImage and checksums
    runs-on: ubuntu-24.04

    steps:
      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG="$PUSH_TAG"
          else
            TAG="$INPUT_TAG"
          fi
          if [[ ! "$TAG" =~ ^v?[0-9]+([.][0-9]+){0,2}$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          printf 'value=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out release
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.value }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install GTK/VTE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libvte-2.91-dev wget

      - name: Build release executable
        run: |
          cargo fmt --check
          cargo test --all-targets
          cargo build --release

      - name: Create AppImage directory
        run: |
          mkdir -p target/appimage/terust.AppDir/usr/bin
          install -m 0755 target/release/terust target/appimage/terust.AppDir/usr/bin/terust
          install -m 0644 packaging/appimage/terust.desktop target/appimage/terust.AppDir/terust.desktop
          install -m 0644 packaging/appimage/terust.svg target/appimage/terust.AppDir/terust.svg
          ln -s usr/bin/terust target/appimage/terust.AppDir/AppRun

      - name: Download appimagetool
        run: |
          wget -q "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage" \
            -O appimagetool
          chmod +x appimagetool
          printf '%s  appimagetool\n' "$APPIMAGETOOL_SHA256" | sha256sum --check --strict

      - name: Build AppImage
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          VERSION="${{ steps.tag.outputs.value }}"
          VERSION="${VERSION#v}"
          ./appimagetool target/appimage/terust.AppDir "terust-${VERSION}-x86_64.AppImage"

      - name: Create executable archive and checksums
        run: |
          VERSION="${{ steps.tag.outputs.value }}"
          VERSION="${VERSION#v}"
          install -m 0755 target/release/terust "terust-${VERSION}-linux-x86_64"
          tar -czf "terust-${VERSION}-linux-x86_64.tar.gz" "terust-${VERSION}-linux-x86_64"
          sha256sum terust-* > SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --generate-notes --title "terust ${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            terust-*.AppImage terust-*.tar.gz terust-*-linux-x86_64 SHA256SUMS \
            --clobber
