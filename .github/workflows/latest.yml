name: Publish latest package

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: true

jobs:
  publish:
    name: Publish rolling latest release
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install GTK/VTE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libvte-2.91-dev

      - name: Build and test release
        run: |
          cargo fmt --check
          cargo test --all-targets --locked
          cargo build --release --locked

      - name: Prepare executable package
        run: |
          install -m 0755 target/release/oxterm oxterm-latest-linux-x86_64
          tar -czf oxterm-latest-linux-x86_64.tar.gz oxterm-latest-linux-x86_64

      - name: Create checksums
        run: sha256sum oxterm-latest-* > SHA256SUMS

      - name: Update rolling tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Rolling build for commit ${GITHUB_SHA}. This prerelease is replaced on every master push."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest \
              --title "Oxterm latest" \
              --notes "$NOTES" \
              --prerelease
          else
            gh release create latest \
              --target "$GITHUB_SHA" \
              --title "Oxterm latest" \
              --notes "$NOTES" \
              --prerelease
          fi
          gh release view latest --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              case "$asset" in
                TRust-*|terust-*|trust-*)
                  gh release delete-asset latest "$asset" --yes
                  ;;
              esac
            done
          gh release upload latest \
          oxterm-latest-linux-x86_64 \
          oxterm-latest-linux-x86_64.tar.gz \
            SHA256SUMS \
            --clobber
