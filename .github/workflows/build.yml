name: Build TRust executable

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux x86_64 release
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install GTK and VTE development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libvte-2.91-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
         run: cargo test --all-targets --locked

      - name: Build release executable
         run: cargo build --release --locked

      - name: Package executable
        run: |
          mkdir -p dist
          install -m 0755 target/release/TRust TRust-linux-x86-64
          install -m 0755 TRust-linux-x86-64 dist/TRust-linux-x86-64
          tar -C dist -czf dist/TRust-linux-x86-64.tar.gz TRust-linux-x86-64

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRust-linux-x86-64
          path: dist/TRust-linux-x86-64.tar.gz
          if-no-files-found: error
