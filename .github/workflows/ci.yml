name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install GTK/VTE development packages
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libvte-2.91-dev
      - run: cargo fmt --check
       - run: cargo test --all-targets --locked
       - run: cargo build --release --locked
