name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install GTK/VTE development packages
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libvte-2.91-dev xvfb
      - run: cargo fmt --check
      - run: cargo test --all-targets --locked
      - name: Run GUI tests
        env:
          OXTERM_GUI_TESTS: "1"
        run: xvfb-run -a cargo test --locked --test gui_lifecycle --test control_api
      - run: cargo build --release --locked

  vte-0-70:
    name: Build against VTE 0.70 (Debian 12)
    runs-on: ubuntu-24.04
    container:
      image: debian:12
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl pkg-config \
            libgtk-3-dev libvte-2.91-dev
          apt-get clean
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the VTE version
        run: pkg-config --modversion vte-2.91
      - name: Build
        run: cargo build --release --locked
      - name: Check the version output
        run: |
          version="$(./target/release/oxterm --version)"
          printf '%s\n' "$version"
          case "$version" in
            Oxterm\ *) ;;
            *) echo "::error::unexpected version output: $version"; exit 1 ;;
          esac
